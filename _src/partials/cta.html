<section class="section section-cta" aria-labelledby="final-cta-heading">
  <div class="container">
    <div class="cta-band">
      <div class="cta-copy">
        <h2 id="final-cta-heading">{{CTA_TITLE}}</h2>
        <p>{{CTA_TEXT}}</p>
      </div>
      <div class="cta-actions">
        <a class="btn btn-primary btn-lg" href="/contact-us#quote-form" data-track="quote_cta_click" data-location="final-cta">Get Free Moving Quote</a>
        <a class="btn btn-outline-light btn-lg" href="tel:{{PHONE_HREF}}" data-track="call_click" data-location="final-cta">Call {{PHONE_DISPLAY}}</a>
        <a class="btn btn-whatsapp btn-lg" href="{{WHATSAPP_URL}}" target="_blank" rel="noopener" data-track="whatsapp_click" data-location="final-cta">WhatsApp Us</a>
      </div>
    </div>
  </div>
</section>
