<section class="section section-cta" aria-labelledby="final-cta-heading">
  <div class="container">
    <div class="cta-band" data-reveal>
      <div class="cta-copy">
        <h2 id="final-cta-heading">{{CTA_TITLE}}</h2>
        <p>{{CTA_TEXT}}</p>
      </div>
      <div class="cta-actions">
        <a class="btn btn-primary btn-lg" href="/contact-us#quote-form" data-track="quote_cta_click" data-location="final-cta">Get Free Moving Quote</a>
        <a class="btn btn-outline-light btn-lg" href="tel:{{PHONE_HREF}}" data-track="call_click" data-location="final-cta">Call {{PHONE_DISPLAY}}</a>
        <a class="btn btn-whatsapp btn-lg" href="{{WHATSAPP_URL}}" target="_blank" rel="noopener" data-track="whatsapp_click" data-location="final-cta">WhatsApp Us</a>
      </div>
      <div class="cta-scene" aria-hidden="true">
        <svg viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 118h220" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
          <path d="M150 118V70l14-4 12 4v48z" fill="rgba(255,255,255,.1)"/>
          <path d="M144 70l20-11 22 11-4 6-18-9-16 9z" fill="#ef6820"/>
          <rect x="160" y="88" width="16" height="16" rx="2" fill="rgba(255,255,255,.14)"/>
          <g transform="translate(10,72)">
            <path d="M0 40V16h58v24z" fill="#f4f8fc"/>
            <path d="M58 24h20.6a6 6 0 0 1 4.9 2.5l9 12.6a6 6 0 0 1 1.1 3.5v9.4H58z" fill="#ef6820"/>
            <path d="M64 30h20v12H64z" fill="#0b2a52" opacity=".18"/>
            <circle cx="18" cy="48" r="9" fill="#0b2a52"/>
            <circle cx="18" cy="48" r="3.4" fill="#fff"/>
            <circle cx="76" cy="48" r="9" fill="#0b2a52"/>
            <circle cx="76" cy="48" r="3.4" fill="#fff"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</section>
